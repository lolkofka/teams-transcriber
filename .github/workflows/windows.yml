name: Windows compatibility and build
on:
  push:
    branches: [main, master, 'codex/**']
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Python regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Native Teams WebView2 smoke test
        timeout-minutes: 3
        run: python tests/windows_webview_smoke.py
      - name: Download small offline draft model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          Invoke-WebRequest https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -OutFile "$env:RUNNER_TEMP/vosk.zip"
          Expand-Archive "$env:RUNNER_TEMP/vosk.zip" -DestinationPath models
      - name: Build Windows application
        run: |
          python -m PyInstaller --noconfirm --clean TeamsTranscriber.spec
          python build_dist.py
      - name: Verify packaged executable
        run: |
          $process = Start-Process ./dist/TeamsTranscriber/TeamsTranscriber.exe -ArgumentList '--bundle-smoke' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Bundle smoke failed: $($process.ExitCode)" }
      - name: Transcribe test audio with packaged application
        timeout-minutes: 12
        shell: pwsh
        run: |
          $process = Start-Process ./dist/TeamsTranscriber/TeamsTranscriber.exe -ArgumentList '--selftest' -PassThru -Wait
          Get-Content -Encoding utf8 ./dist/TeamsTranscriber/selftest.log
          if ($process.ExitCode -ne 0) { throw "Transcription selftest failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: TeamsTranscriber-windows-x64
          path: dist/TeamsTranscriber-*.zip
          if-no-files-found: error
